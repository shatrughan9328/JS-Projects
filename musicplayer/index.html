<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musciplayer</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="box">
      <div class="img">
        <img src="./images/img/img/ishq.jpg" alt="" />
      </div>
      <marquee behavior="" direction="right">ishq hai tu</marquee>
      <audio src="./images/music/music/Barbaad Reprise Female-320kbps.mp3" id="audio"></audio>
      <div class="button">
        <i class="fa-solid fa-backward" onclick="pre()"></i>
        <i class="fa-solid fa-play" onclick="aplay()"></i>
        <i class="fa-solid fa-pause" onclick="apause()"></i>
        <i class="fa-solid fa-forward" onclick="nxt()"></i>
      </div>
    </div>

    

    <script src="./js/script.js"></script>
  </body>
</html>
